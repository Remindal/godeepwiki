# DeepWiki(Go版) 开发/验收态全容器化基础设施（总纲 §3.1）。
# 用法：docker compose up -d --build → docker compose ps 确认全部 healthy。
# 注意：本文件中的 deepwiki/deepwiki 与 guest/guest 仅为开发态默认口令占位，禁止用于生产。
services:
  postgres:
    image: pgvector/pgvector:pg16            # 含 pgvector 扩展（CREATE EXTENSION vector 由迁移完成）
    container_name: deepwiki-postgres
    environment:
      POSTGRES_DB: deepwiki
      POSTGRES_USER: deepwiki
      POSTGRES_PASSWORD: deepwiki   # 开发态占位
    ports:
        - "5432:5432"
    command: postgres -c shared_buffers=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepwiki -d deepwiki"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: deepwiki-opensearch
    environment:
      discovery.type: single-node            # 开发态单节点；生产 3 节点 number_of_replicas=1
      plugins.security.disabled: "true"      # 开发态关安全插件
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Deepwiki@123"  # OpenSearch 2.12+ 启动要求（开发态占位）
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13.7-management        # management UI 开发态映射到宿主机
    container_name: deepwiki-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: deepwiki        # 开发态占位；同步修改 DEEPWIKI_RABBITMQ_URL
      RABBITMQ_DEFAULT_PASS: deepwiki
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis-master:
    image: redis:7.4.1-alpine
    container_name: deepwiki-redis-master
    command: redis-server --appendonly yes
    volumes:
      - rdmaster:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-replica-1:
    image: redis:7.4.1-alpine
    container_name: deepwiki-redis-replica-1
    command: redis-server --appendonly yes --replicaof redis-master 6379
    volumes:
      - rdreplica1:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-replica-2:
    image: redis:7.4.1-alpine
    container_name: deepwiki-redis-replica-2
    command: redis-server --appendonly yes --replicaof redis-master 6379
    volumes:
      - rdreplica2:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-sentinel-1:
    image: redis:7.4.1-alpine
    container_name: deepwiki-redis-sentinel-1
    command: ["redis-server", "/tmp/sentinel.conf", "--sentinel"]
    volumes:
      - ./deploy/redis-sentinel/sentinel-1.conf:/tmp/sentinel.conf
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-sentinel-2:
    image: redis:7.4.1-alpine
    container_name: deepwiki-redis-sentinel-2
    command: ["redis-server", "/tmp/sentinel.conf", "--sentinel"]
    volumes:
      - ./deploy/redis-sentinel/sentinel-2.conf:/tmp/sentinel.conf
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-sentinel-3:
    image: redis:7.4.1-alpine
    container_name: deepwiki-redis-sentinel-3
    command: ["redis-server", "/tmp/sentinel.conf", "--sentinel"]
    volumes:
      - ./deploy/redis-sentinel/sentinel-3.conf:/tmp/sentinel.conf
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.21       # 开发态单节点；生产 3 节点集群（总纲 §3.2）
    container_name: deepwiki-etcd
    environment:
      ETCD_NAME: deepwiki-etcd-0
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: deepwiki-etcd-0=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
    command: ["etcd"]
    volumes:
      - etcddata:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: deepwiki-app
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      etcd:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./data/repos:/app/data/repos
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    environment:
      # 外网（provider API / git clone）走宿主机 Clash Verge 代理（端口 7897）；
      # 集群内服务名与环回必须绕过代理，否则 gRPC/etcd 经代理不可达，启动卡在 etcd LoadAll。
      - HTTP_PROXY=http://host.docker.internal:7897
      - HTTPS_PROXY=http://host.docker.internal:7897
      - NO_PROXY=etcd,postgres,rabbitmq,opensearch,redis-master,redis-replica-1,redis-replica-2,redis-sentinel-1,redis-sentinel-2,redis-sentinel-3,localhost,127.0.0.1,host.docker.internal
      - no_proxy=etcd,postgres,rabbitmq,opensearch,redis-master,redis-replica-1,redis-replica-2,redis-sentinel-1,redis-sentinel-2,redis-sentinel-3,localhost,127.0.0.1,host.docker.internal

volumes:
  pgdata:
  osdata:
  rmqdata:
  rdmaster:
  rdreplica1:
  rdreplica2:
  etcddata:
